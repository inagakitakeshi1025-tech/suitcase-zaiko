<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ログイン - 在庫管理</title>
<style>
  :root {
    --accent: #159089;
    --accent-dark: #0d6b65;
    --bg: #faf6ee;
    --card-bg: #ffffff;
    --border: #ece4d2;
    --text: #2d2a24;
    --muted: #8b8477;
    --alert-bg: #fbe3e1;
    --alert-text: #b3352c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 360px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px 24px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
  }
  h1 {
    margin: 0 0 20px;
    font-size: 18px;
    text-align: center;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin: 14px 0 6px;
  }
  input {
    width: 100%;
    font-size: 16px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
  }
  input:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
  }
  button {
    width: 100%;
    margin-top: 22px;
    font-size: 16px;
    font-weight: bold;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--accent-dark), var(--accent));
    color: #fff;
    cursor: pointer;
  }
  button:active { opacity: 0.85; }
  .error {
    margin: 0 0 4px;
    padding: 10px 12px;
    border-radius: 8px;
    background: var(--alert-bg);
    color: var(--alert-text);
    font-size: 14px;
  }
</style>
</head>
<body>
<div class="card">
  <h1>在庫管理 ログイン</h1>
  <p class="error" id="error-msg" style="display:none">ユーザ名またはパスワードが違います。</p>
  <form method="POST" action="/login">
    <label for="username">ユーザ名</label>
    <input type="text" id="username" name="username" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <label for="password">パスワード</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <button type="submit">サインイン</button>
  </form>
</div>
<script>
  if (new URLSearchParams(location.search).get("error")) {
    document.getElementById("error-msg").style.display = "block";
  }
</script>
</body>
</html>
